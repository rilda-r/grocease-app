name: Build GrocEase Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/grocease.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocease-apk
          path: android/app/build/outputs/apk/debug/grocease.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "GrocEase App v1.0.0"
          body: "Official Android APK for GrocEase — Smart Shared Grocery Tracker & Budget Manager."
          files: android/app/build/outputs/apk/debug/grocease.apk
